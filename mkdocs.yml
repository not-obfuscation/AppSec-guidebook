# Конфигурация сайта. Правится руками — это единственное место, где заданы тема,
# расширения markdown и плагины.
#
# `nav`, `docs_dir` и `site_dir` здесь НЕ окончательные: сборщик
# `tools/build_site.py` кладёт рядом со staging-деревом файл `build/mkdocs.yml`,
# который наследует этот конфиг (`INHERIT`) и дописывает навигацию, выведенную из
# `stage` и `order` тем. Причина такого разделения — 9.1 п. 7: оглавление
# выводится из данных, а не пишется руками, но тема и расширения данными не
# выводятся. Собирать надо всегда через `make site`; прямой вызов
# `mkdocs build` без сборщика соберёт пустое дерево.
#
# Движок и почему он — в `docs/reports/INFRA.md`.

site_name: AppSec-гайдбук
site_description: >
  Учебник по прикладной безопасности приложений: разбор механизмов до уровня,
  на котором дефект видно в чужом коде.
site_author: автор гайдбука
copyright: >
  Тексты — CC BY-SA 4.0, код примеров — MIT. Подробности — на странице
  «Атрибуции и лицензии».

# Переписывается сборщиком; здесь стоит, чтобы конфиг был валиден сам по себе.
docs_dir: build/site-src
site_dir: site

# Адреса вида `stage-0/cookies.html`, а не `stage-0/cookies/`. Так сайт
# открывается с диска, без сервера: `file:///…/site/index.html` работает, и
# офлайн-поиск тоже. Плагин `offline` требует именно этого.
use_directory_urls: false

# Битая внутренняя ссылка или битый анкорь роняют сборку. Это второй рубеж после
# `S-LINK-MD` и `S-LINK-TOPIC`: линтер проверяет исходники, сборка — то, что
# получилось после превращения `id` в ссылки.
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: ru
  features:
    # Этапы стоят в оглавлении разделами, а не раскрывающимися ветками: этапов
    # восемь (шестой исключён из скоупа), и прятать их друг от друга не за чем.
    - navigation.sections
    - navigation.top
    # Хлебные крошки над заголовком и футер «Назад / Вперёд» (А6, research/10
    # § 2.2): «где я» видно и на узком экране. Блок «Дальше» на странице
    # остаётся — он печатается, футер нет.
    - navigation.path
    - navigation.footer
    - toc.follow
    # Листинги копируются кнопкой: примеры в темах предназначены для запуска.
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.suggest
  # Решение оператора 2026-10-02: тёмная тема по умолчанию, светлая —
  # переключателем. Первая палитра без `media` — та, что включается при первом
  # открытии; выбор читателя движок помнит сам. Цвета обеих задаёт
  # `assets/extra.css` (собирает `tools/build_site.py`): `custom` значит, что
  # готовые палитры движка не подмешиваются.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  font: false          # системные шрифты: сайт не ходит в сеть за Google Fonts
  icon:
    logo: material/console

plugins:
  # Поиск по русскому тексту: словарь lunr.ru лежит в самой теме, из сети
  # ничего не загружается.
  - search:
      lang: [ru, en]
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  # Теги — фасеты каталога (9.5 п. 9). Индекс собирается на странице `tags.md`.
  - tags
  # Собирает страницу под открытие с диска: инлайнит то, что иначе требует
  # сервера, и включает поиск на `file://`.
  - offline

markdown_extensions:
  # Аббревиатуры вклеиваются в каждую страницу сборщиком из `glossary.yaml`:
  # раскрытие термина показывается по наведению, а канон написания остаётся
  # единственным (6.3).
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  # Нумерованный список начинается с написанного номера: ответ «3.» под
  # `<details>` и вопрос после листинга не превращаются в «1.».
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Ссылка на этот заголовок
      # Тем же слагом считает анкоря `tools/linkcheck.py` (S-LINK-MD). Умолчание
      # python-markdown выбрасывает всё вне ASCII, и от «## 3. Механика» остался
      # бы анкорь «3».
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      # Класс `language-*` у листинга: по нему CSS подписывает шапку окна.
      pygments_lang_class: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets

extra_css:
  - assets/extra.css

extra:
  # Аналитики нет и не будет: сайт открывается с диска и никуда не стучится.
  generator: false
