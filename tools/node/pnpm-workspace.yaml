# Скрипты сборки зависимостей запрещены, и это осознанно: единственный, кто их
# просит, — puppeteer, который в postinstall тянет себе браузер. Здесь он
# запрещён, а `chrome-headless-shell` ставится отдельным шагом `tools/setup.sh`.
# Так видно, что именно и когда качается, и так этот браузер попадает в кэш CI
# отдельным ключом.
#
# Значение обязано быть `false`, а не пустым: pnpm 10 на невыполненных скриптах
# возвращает ERR_PNPM_IGNORED_BUILDS и код 1, даже когда все 270 пакетов встали.
allowBuilds:
  puppeteer: false
