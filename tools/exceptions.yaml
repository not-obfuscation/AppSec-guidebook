# Срабатывания, законные навсегда, — STYLE.md § 1.4.
#
# Исключение заводится, только если правило неприменимо к этому месту в
# принципе. Замечание к содержанию исключением не закрывается: оно закрывается
# правкой содержания. Поэтому список короткий, и каждая запись объясняет
# прочтение словами, а не помечает срабатывание словом «ложное».
#
# Поля:
#   rule   — идентификатор правила: канонический из STYLE.md (`L-BANNED`) или
#            родной для инструмента (`AppSec.Banned`, `MD009/no-trailing-spaces`),
#            обёртка принимает оба;
#   file   — путь от корня репозитория, без шаблонов: исключение адресное;
#   match  — подстрока найденного фрагмента. Что считается фрагментом:
#            Vale — поле Match, markdownlint — Context из вывода, свои линтеры —
#            текст замечания. Обёртка печатает фрагмент рядом с каждым снятым
#            срабатыванием, так что подстроку видно, куда целить;
#   reason — почему прочтение законно;
#   added  — дата: при ревизии видно, сколько исключение живёт.
#
# Обёртка `tools/check.py` применяет этот список единообразно ко всем четырём
# линтерам, печатает снятое отдельным разделом и считает. Исключение, которое
# не сработало ни разу, обёртка тоже показывает: правило или текст изменились,
# и запись пора убрать.

- rule: L-BANNED
  file: content/stage-0/cors.md
  match: "простой"
  reason: >
    «Простой запрос» — классификатор Fetch Standard (simple request, в
    действующей редакции — CORS-safelisted request), а не оценка сложности для
    читателя. Правило 6.5 запрещает «просто» и «легко» как обесценивающие
    слова: они сообщают читателю, что он должен был понять сам. Здесь слово
    несёт противоположную работу — делит запросы на два класса, и от того,
    в каком классе запрос, зависит, уйдёт ли предварительный. Заменить нечем:
    в русской литературе по CORS закрепилось это же название.
  added: 2026-08-22

- rule: S-LINK-SOURCE-URL
  file: content/stage-1/password-storage.md
  match: "NIST.SP.800-63b-4.pdf"
  reason: >
    Расхождение той формы, которую само правило называет законной: сноска ведёт
    на файл документа (`nvlpubs.nist.gov/.../NIST.SP.800-63b-4.pdf`), запись
    реестра — на страницу выпуска (`csrc.nist.gov/pubs/sp/800/63/b/4/final`).
    NIST держит оба адреса: страница выпуска называет статус, дату и историю
    редакций, файл — сам текст. Читателю нужен текст, реестру — страница, по
    которой видно, не сменился ли статус. Свести к одному адресу нельзя без
    потери одной из двух функций, и это не свойство места, а свойство того, как
    NIST публикует SP.
  added: 2026-08-23

- rule: S-LINK-SOURCE-URL
  file: content/stage-1/access-control-models.md
  match: "nistir7316.pdf"
  reason: >
    Тот же случай, что у `NIST.SP.800-63b-4.pdf` в `password-storage`, и
    правило называет его законным само. Сноска ведёт на файл документа
    (`nvlpubs.nist.gov/.../nistir7316.pdf`), запись реестра — на страницу
    публикации (`csrc.nist.gov/pubs/ir/7316/final`). Страница публикации
    держит статус, дату и историю редакций; файл держит текст. Читателю
    темы нужен текст: в сносках названы § 2.1, § 3.1, § 3.4 и § 3.4.5, а
    на странице публикации разделов нет.
  added: 2026-08-23

- rule: S-CODE-LEN
  file: content/stage-1/password-storage.md
  match: "листинг 32 строк"
  reason: >
    Листинг обязан совпадать с реальным правилом
    `pilot/semgrep/password-fast-digest.yaml`: усечённая копия оказалась
    невалидной (находка аудита К-1, 2026-08-30), а читатель копирует правило
    целиком. Полный текст правила — 32 строки, что укладывается в ориентир
    25–40 из research/05; сокращение до нормы 25 снова сломало бы
    соответствие файлу, а значит, и валидность.
  added: 2026-08-30

- rule: S-LINK-SOURCE-URL
  file: content/stage-1/access-control-models.md
  match: "NIST.SP.800-162.pdf"
  reason: >
    То же самое для второй публикации NIST: сноска ведёт на файл
    (`nvlpubs.nist.gov/.../NIST.SP.800-162.pdf`), реестр — на страницу
    публикации (`csrc.nist.gov/pubs/sp/800/162/upd2/final`). Свести к
    одному адресу нельзя без потери одной из двух функций, и это свойство
    того, как NIST публикует свои документы, а не свойство темы.
  added: 2026-08-23

# G-FIRST про «правило SAST» в темах этапа 1 (2026-08-30, пополнение глоссария
# терминами этапов 2–3). Общее обоснование: «написать правило SAST на …» —
# сквозная практика этапа 1, заявленная в целях темы, а сам инструментарий
# вводится темой `sast-principles` этапа 2, названной в `defines` записи
# глоссария. Раскрытие аббревиатуры скобкой в каждом пункте целей дало бы одну
# и ту же вставку в двенадцати темах до единственного места, где SAST
# разбирается; на собранном сайте расшифровку при наведении даёт подсказка
# из глоссария (STYLE.md § 5, G-FIRST).

- rule: G-FIRST
  file: content/stage-1/sqli-basics.md
  match: "первое употребление «SAST»"
  reason: >
    «Написать правило SAST на запрос, собранный из строк» — пункт целей темы:
    название навыка, а не материал. Правила SAST — сквозная практика этапа 1,
    инструментарий вводит `sast-principles` (этап 2, в `defines` записи
    глоссария); на собранном сайте расшифровку даёт подсказка abbr.
  added: 2026-08-30

- rule: G-FIRST
  file: content/stage-1/parameterized-queries.md
  match: "первое употребление «SAST»"
  reason: >
