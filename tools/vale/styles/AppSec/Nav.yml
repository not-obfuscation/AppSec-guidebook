extends: existence
message: "6.5: навигация словом «%s» — поставьте якорную ссылку с названием раздела"
link: STYLE.md#L-NAV
level: error
ignorecase: true
nonword: true
# Текст ссылки ищет `NavLink.yml`: в прозе, которую видит это правило,
# квадратных скобок уже нет.
tokens:
  - '(?:^|[^\p{L}\p{N}_-])((?:см\.|смотри(?:те)?) (?:выше|ниже))'
  - '(?:^|[^\p{L}\p{N}_-])((?:в|на) (?:таблице|схеме|листинге|примере|рисунке|скриншоте) (?:выше|ниже|слева|справа))'
  - '(?:^|[^\p{L}\p{N}_-])((?:таблиц[аеу]|схем[аеу]|листинг|рисунок|скриншот) (?:выше|ниже))'
