extends: existence
message: "6.5: «%s» без версии или даты — назовите версию либо дату"
link: STYLE.md#L-TIMELESS
level: warning
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}\p{N}_-])(сейчас)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(в настоящее время)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(на сегодняшний день)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(современн[ыоаеи]\p{L}*)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(скоро)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(недавно)(?:[^\p{L}]|$)'
  # «новый» из списка 6.5 здесь нет умышленно: в корпусе двенадцати тем все
  # тринадцать вхождений — смысл «только что созданный» («выдаётся новый
  # токен», «каждый новый поддомен»), а не «недавно появившийся». Ни одного
  # запрещённого употребления правило не поймало бы, зато обучило бы автора
  # пролистывать вывод. Значение «нового = современного» проверяется глазами,
  # STYLE.md § 9.
