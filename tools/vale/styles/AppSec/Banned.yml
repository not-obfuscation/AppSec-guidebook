extends: existence
message: "6.5: запрещённая конструкция «%s»"
link: STYLE.md#L-BANNED
level: error
ignorecase: true
nonword: true
tokens:
  # «(?!в)» после гласной — чтобы не ловить «проставить», «проставлены»,
  # «проставляет»: у них после «проста» стоит «в», а правило про «просто»
  # (заявка З-3). Движок Vale 3.x (regexp2) понимает lookahead.
  - '(?:^|[^\p{L}\p{N}_-])(прост[оаыейиую](?!в)\p{L}*)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(легк[оаяийоеуих]\p{L}*)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(очевидн\p{L}*)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(всего лишь)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(элементарн\p{L}*)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(не составит труда)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(как известно)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}\p{N}_-])(всем понятно)(?:[^\p{L}]|$)'
