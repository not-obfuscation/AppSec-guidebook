extends: existence
message: "6.4: здесь нужен неразрывный пробел — «%s»"
link: STYLE.md#L-NBSP
level: warning
nonword: true
tokens:
  # Слева от числа — не буква. Иначе цифра на конце имени продукта читается как
  # число с единицей: «переход на IMDSv2 с отключением» — это «2 с», и правило
  # требовало неразрывный пробел внутри чужого названия (находка Н-S4 миссии
  # SSRF). Имена такого вида в гайде обычны: IMDSv2, HTTP2, SHA2, CSP3.
  - '(?:^|[^\p{L}])\d+ (?:МБ|КБ|ГБ|ТБ|байт|бит|мс|мин|ч|с)(?:[^\p{L}]|$)'
  - '§ \d'
  - '(?:^|[^\p{L}])т\. е\.'
  - '(?:^|[^\p{L}])т\. д\.'
  - '(?:^|[^\p{L}])т\. п\.'
