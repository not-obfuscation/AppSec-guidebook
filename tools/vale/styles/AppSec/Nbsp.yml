extends: existence
message: "6.4: здесь нужен неразрывный пробел — «%s»"
link: STYLE.md#L-NBSP
level: warning
nonword: true
tokens:
  # Слева от числа — не буква. Иначе цифра на конце имени продукта читается как
  # число с единицей: «переход на IMDSv2 с отключением» — это «2 с», и правило
  # требовало неразрывный пробел внутри чужого названия (находка Н-S4 миссии
  # SSRF). Имена такого вида в гайде обычны: IMDSv2, HTTP2, SHA2, CSP3.
  # Слева от числа — также не цифра, не точка и не дефис. Иначе предлог «с»
  # после версии или даты читается как единица «секунда»: «Semgrep 1.174.0 с
  # локальным набором», «прочитана лично 2026-08-25 с …» (заявка З-2). Цена —
  # слепое пятно на десятичной дроби с точкой («2.5 с» не ловится); русская
  # запись через запятую («2,5 с») ловится по-прежнему.
  - '(?:^|[^\p{L}\d.-])\d+ (?:МБ|КБ|ГБ|ТБ|байт|бит|мс|мин|ч|с)(?:[^\p{L}]|$)'
  - '§ \d'
  - '(?:^|[^\p{L}])т\. е\.'
  - '(?:^|[^\p{L}])т\. д\.'
  - '(?:^|[^\p{L}])т\. п\.'
