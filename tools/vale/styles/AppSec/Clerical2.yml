extends: existence
message: "6.5: канцелярит «%s» — местоимение «данный» вместо «этот»"
link: STYLE.md#L-CLERICAL2
level: warning
ignorecase: true
nonword: true
tokens:
  # Формы `данные`, `данных`, `данным`, `данными` совпадают у местоимения и у
  # существительного «данные», и по одной словоформе их не различить:
  # существительное стоит в гайде про безопасность на каждой странице и
  # абсолютно законно. Зато местоимение во множественном числе живёт в закрытом
  # наборе оборотов канцелярита, где существительное невозможно: данные не
  # бывают мерой, условием или образом. Поэтому правило ловит оборот, а не
  # словоформу.
  #
  # Отвлечённые существительные — при любой форме местоимения.
  - '(?:^|[^\p{L}\p{N}_-])(данн(?:ые|ых|ым|ыми) (?:мер|требовани|правил|положени|сведени|действи|рекомендаци|услови|случа|обстоятельств|пример)\p{L}*)'
  # Существительные образа действия — только после `данным`/`данными`. После
  # `данные`/`данных` та же пара законна с существительным: «фильтрует данные
  # методами ORM», «защищает данные средствами платформы».
  - '(?:^|[^\p{L}\p{N}_-])(данным (?:образом|способом|методом|путём|средством|инструментом|подходом))'
  - '(?:^|[^\p{L}\p{N}_-])(данными (?:способами|методами|средствами|инструментами|подходами))'
