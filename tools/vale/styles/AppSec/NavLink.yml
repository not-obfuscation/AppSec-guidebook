# Вторая половина L-NAV: текст ссылки.
#
# Vale снимает разметку прежде, чем отдать текст правилам: из `[здесь](#a)` до
# правила доходит `здесь`, и по одному этому слову навигацию от прозы не
# отличить («переходит по ссылке из письма» — законно). Поэтому квадратные
# скобки ищутся в исходнике: `scope: raw`. Остальные образцы L-NAV работают по
# прозе и живут в `Nav.yml` — у обоих файлов один идентификатор STYLE.md#L-NAV,
# потому что для автора это одно правило.
extends: existence
message: "6.5: навигация словом «%s» — поставьте якорную ссылку с названием раздела"
link: STYLE.md#L-NAV
level: error
scope: raw
ignorecase: true
nonword: true
tokens:
  - '\[(?:здесь|тут|по ссылке|читать далее|подробнее|ссылка)\]\('
