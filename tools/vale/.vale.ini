# Стайлгайд гайдбука для Vale. Правила — перенос части 6 `PLAYBOOK.md`,
# соответствие пунктов и правил — в `STYLE.md`.
#
# Запускается не напрямую, а через `tools/check.py` (она подставляет пути,
# приводит вывод к общему формату и применяет `tools/exceptions.yaml`) —
# то есть через `make check`.

StylesPath = styles
MinAlertLevel = warning
Vocab = AppSec

[*.md]
BasedOnStyles = AppSec

# Автоссылки блока 14 и адреса внутри текста разбирать не надо: там латиница,
# косые черты и дефисы, которые ловятся правилами типографики.
TokenIgnores = (<https?://[^>]+>), (https?://\S+)
