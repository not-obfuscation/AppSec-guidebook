# Справочники контентной модели: закрытые словари, против которых проверяется
# frontmatter тем. Часть 9.2 PLAYBOOK.md: «Контролируемый словарь тегов
# обязателен — иначе „sast“, „SAST“ и „статический анализ“ станут тремя разными
# тегами. Тег вне словаря ломает сборку.» То же правило распространено здесь на
# этапы, режимы, статусы, уровни и категории кода темы.
#
# ЧТО ЗДЕСЬ ЛЕЖИТ, А ЧТО НЕТ
#
#   здесь — словари: перечисления допустимых значений и канон скелета;
#   в `topics.yaml` — карта тем, выведенная из плана обучения (генерируется);
#   в `sources.yaml` — реестр источников (правится автором вручную);
#   в `labs.yaml` — реестр лаб;
#   в `glossary.yaml` — термины.
#
# Файл читают `tools/validate_content.py` (проверки семейства `C-*`, описаны в
# `SCHEMA.md`) и сборка сайта. Правится вручную: новый тег, новая категория или
# новый этап добавляются автором вместе с первой темой, которая их требует.
# Значение из словаря не удаляется, пока на него ссылается хотя бы одна тема.

# --- этапы ------------------------------------------------------------------
#
# `num` и `title` совпадают с `topics.yaml`, то есть с планом обучения; `slug` —
# неизменяемый идентификатор этапа для frontmatter и адресов; `dir` — каталог
# внутри `content/`. Иерархия одна: этап → тема (9.1 п. 4), поэтому у темы
# ровно один этап-дом и лежит она в каталоге своего этапа.

stages:
  - num: 0
    slug: protocol-basics
    dir: stage-0
    title: "База протокола и модели веб-приложения"
  - num: 1
    slug: web-vulns
    dir: stage-1
    title: "Веб-уязвимости"
  - num: 2
    slug: appsec-tooling
    dir: stage-2
    title: "Инструментарий AppSec"
  - num: 3
    slug: ci-cd
    dir: stage-3
    title: "Встройка в CI/CD"
  - num: 4
    slug: infrastructure
    dir: stage-4
    title: "Инфраструктура"
  - num: 5
    slug: secure-sdlc
    dir: stage-5
    title: "Процессы безопасной разработки"
  - num: 6
    slug: ru-regulation
    dir: stage-6
    title: "Российская нормативная база"
    excluded: true          # решение оператора от 2026-08-20, тем не будет
  - num: 7
    slug: code-review-languages
    dir: stage-7
    title: "Языки для code review"
  - num: 8
    slug: optional
    dir: stage-8
    title: "Опционально, на потом"

# --- уровни глубины ---------------------------------------------------------
#
# Часть 3.1. Уровень задаёт подробность, а не самодостаточность: на любом
# уровне объяснение и пример свои. `words` — норма объёма из той же таблицы;
# считает её `tools/wordcount.py` и печатает без вердикта (свод не задаёт, что
# именно считать словом, — см. `STYLE.md` § 9).

depths:
  L1:
    meaning: владеть
    words: [2500, 3500]
  L2:
    meaning: применить по инструкции
    words: [800, 1700]
  L3:
    meaning: узнать
    words: [300, 500]

# --- статусы ----------------------------------------------------------------
#
# 9.3. Заглушка публикуется с плашкой «в работе» (9.5 п. 17), из sitemap
# исключается до статуса `draft`.

statuses: [stub, draft, published]

# --- риторические режимы ----------------------------------------------------
#
# 9.2: тип записи и риторический режим — разные вещи. Смешивать режимы на одной
# странице запрещено; машина видит только объявленный режим, смешение ловится
# глазами (`STYLE.md` § 9).

modes: [концепт, практика, рецепт, справка, траблшутинг, карта]

# --- категории кода темы ----------------------------------------------------
#
# Категория группирует темы по предмету и живёт здесь, чтобы «PROTO» и
# «PROTOCOL» не стали двумя категориями. Со страницы код темы `AG-<CAT>-<NN>`
# убран решением оператора от 2026-08-24 (свод 4.1), и словарь остался
# единственным местом, где категории подразделов записаны машиночитаемо.
#
# `sub` — номер подраздела плана обучения, тот же, что в `topics.yaml`.
# Соответствие один к одному и проверяется (`C-TAX-CATEGORY`, `SCHEMA.md` § 8):
# категория без подраздела в плане, две категории на один подраздел и
# написанный подраздел без категории роняют проверку. Без этой сверки словарь
# молча расходится с планом — так он и умер между миссиями SSRF и Injection
# (находки Н-S2 и Н-I3).
#
# Категория заводится вместе с первой темой своего подраздела. Подразделы, по
# которым тем ещё нет, здесь не перечисляются: категория, придуманная заранее,
# — это догадка о ненаписанном тексте, а не запись факта.

code_categories:
  PROTO:
    sub: "0"
    means: "база протокола и модели веб-приложения"
  AC:
    sub: "1.1"
    means: "контроль доступа: право на объект и право на действие"
  SSRF:
    sub: "1.2"
    means: "запросы, которые сервер делает по адресу из данных"
  INJ:
    sub: "1.3"
    means: "инъекции: данные, прочитанные как код или запрос"
  CLIENT:
    sub: "1.4"
    means: "клиентские уязвимости: исполнение и подмена в браузере"
  CSRF:
    sub: "1.5"
    means: "запросы от имени пользователя без его намерения"
  AUTH:
    sub: "1.6"
    means: "аутентификация, сессии, хранение секретов аутентификации"
  TOKEN:
    sub: "1.7"
    means: "токены и делегирование доступа: JWT, OAuth, OIDC, SAML"
  DATA:
    sub: "1.8"
    means: "работа с файлами и утечки данных"
  LOGIC:
    sub: "1.9"
    means: "правила предметной области и состояние: порядок шагов, гонки, счёт"

# --- теги -------------------------------------------------------------------
#
# Фасеты для каталога и фильтров (9.5 п. 9). Тег — не рубрика: этап у темы один,
# тегов несколько. Словарь закрытый; новый тег добавляется вместе с темой,
# которая его требует, и с одной строкой смысла — иначе через сто тем никто не
# сможет сказать, чем `http` отличается от `protocol`.

