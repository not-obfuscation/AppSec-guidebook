# Справочники контентной модели: закрытые словари, против которых проверяется
# frontmatter тем. Часть 9.2 PLAYBOOK.md: «Контролируемый словарь тегов
# обязателен — иначе „sast“, „SAST“ и „статический анализ“ станут тремя разными
# тегами. Тег вне словаря ломает сборку.» То же правило распространено здесь на
# этапы, режимы, статусы, уровни и категории кода темы.
#
# ЧТО ЗДЕСЬ ЛЕЖИТ, А ЧТО НЕТ
#
#   здесь — словари: перечисления допустимых значений и канон скелета;
#   в `topics.yaml` — карта тем, выведенная из плана обучения (генерируется);
#   в `sources.yaml` — реестр источников (правится автором вручную);
#   в `labs.yaml` — реестр лаб;
#   в `glossary.yaml` — термины.
#
# Файл читают `tools/validate_content.py` (проверки семейства `C-*`, описаны в
# `SCHEMA.md`) и сборка сайта. Правится вручную: новый тег, новая категория или
# новый этап добавляются автором вместе с первой темой, которая их требует.
# Значение из словаря не удаляется, пока на него ссылается хотя бы одна тема.

# --- этапы ------------------------------------------------------------------
#
# `num` и `title` совпадают с `topics.yaml`, то есть с планом обучения; `slug` —
# неизменяемый идентификатор этапа для frontmatter и адресов; `dir` — каталог
# внутри `content/`. Иерархия одна: этап → тема (9.1 п. 4), поэтому у темы
# ровно один этап-дом и лежит она в каталоге своего этапа.

stages:
  - num: 0
    slug: protocol-basics
    dir: stage-0
    title: "База протокола и модели веб-приложения"
  - num: 1
    slug: web-vulns
    dir: stage-1
    title: "Веб-уязвимости"
  - num: 2
    slug: appsec-tooling
    dir: stage-2
    title: "Инструментарий AppSec"
  - num: 3
    slug: ci-cd
    dir: stage-3
    title: "Встройка в CI/CD"
  - num: 4
    slug: infrastructure
    dir: stage-4
    title: "Инфраструктура"
  - num: 5
    slug: secure-sdlc
    dir: stage-5
    title: "Процессы безопасной разработки"
  - num: 6
    slug: ru-regulation
    dir: stage-6
    title: "Российская нормативная база"
    excluded: true          # решение оператора от 2026-08-20, тем не будет
  - num: 7
    slug: code-review-languages
    dir: stage-7
    title: "Языки для code review"
  - num: 8
    slug: optional
    dir: stage-8
    title: "Опционально, на потом"

# --- уровни глубины ---------------------------------------------------------
#
# Часть 3.1. Уровень задаёт подробность, а не самодостаточность: на любом
# уровне объяснение и пример свои. `words` — норма объёма из той же таблицы;
# считает её `tools/wordcount.py` и печатает без вердикта (свод не задаёт, что
# именно считать словом, — см. `STYLE.md` § 9).

depths:
  L1:
    meaning: владеть
    words: [2500, 3500]
  L2:
    meaning: применить по инструкции
    words: [800, 1200]
  L3:
    meaning: узнать
    words: [300, 500]

# --- статусы ----------------------------------------------------------------
#
# 9.3. Заглушка публикуется с плашкой «в работе» (9.5 п. 17), из sitemap
# исключается до статуса `draft`.

statuses: [stub, draft, published]

# --- риторические режимы ----------------------------------------------------
#
# 9.2: тип записи и риторический режим — разные вещи. Смешивать режимы на одной
# странице запрещено; машина видит только объявленный режим, смешение ловится
# глазами (`STYLE.md` § 9).

modes: [концепт, практика, рецепт, справка, траблшутинг, карта]

# --- категории кода темы ----------------------------------------------------
#
# Код в шапке темы: `AG-<CAT>-<NN>`, где `NN` — номер темы внутри подраздела
# плана (последнее число `plan_id`). Категория группирует темы по предмету и
# живёт здесь, чтобы «PROTO» и «PROTOCOL» не стали двумя категориями.

code_categories:
  PROTO: "база протокола и модели веб-приложения"
  AUTH: "аутентификация, сессии, хранение секретов аутентификации"

# --- теги -------------------------------------------------------------------
#
# Фасеты для каталога и фильтров (9.5 п. 9). Тег — не рубрика: этап у темы один,
# тегов несколько. Словарь закрытый; новый тег добавляется вместе с темой,
# которая его требует, и с одной строкой смысла — иначе через сто тем никто не
# сможет сказать, чем `http` отличается от `protocol`.

tags:
  api: "интерфейсы приложения: REST, GraphQL, gRPC"
  architecture: "устройство системы: где выполняется код и кто стоит между узлами"
  auth: "аутентификация и удержание состояния входа"
  browser: "механизмы, работающие на стороне браузера"
  cookies: "cookie как механизм: атрибуты, область действия, префиксы"
  crypto: "криптографические примитивы и их применение"
  encoding: "кодирование и декодирование данных"
  headers: "поля заголовков HTTP как механизм управления"
  http: "протокол HTTP: методы, коды, поля, семантика"
  origin: "модель origin и границы доверия браузера"
  protocol: "модели и правила обмена, не сводимые к одному полю"
  proxy: "промежуточные узлы: обратный прокси, CDN, перехват"
  session: "сессия как состояние между запросами"
  tls: "транспортное шифрование и сертификаты"
  tooling: "рабочие инструменты AppSec-инженера"
  unicode: "Unicode-нормализация и визуальная подмена символов"
  url: "структура URL и его разбор"

# --- канонический скелет темы -----------------------------------------------
#
# Часть 4. Порядок блоков одинаков для всех тем; отклонение допускается только
# удалением блока с явной пометкой, никогда — перестановкой.
#
#   `title`    заголовок блока в теме, дословно (h2 вида `## N. Title`);
#   `required` уровни, на которых блок обязателен;
#   `allowed`  уровни, на которых блок законен, но не обязателен;
#   `alt`      другой законный заголовок с условием — на каком уровне.
#
# Состав по уровням сведён из двух мест свода, которые расходятся, — таблица
# 3.1 и маркеры части 4. Как именно сведён и почему — `SCHEMA.md` § 4.

blocks:
  - num: 0
    title: Коротко
    required: [L1, L2, L3]
  - num: 1
    title: Цели
    required: [L1, L2]
  - num: 2
    title: Предвопросы
    required: [L1]
  - num: 3
    title: Механика
    required: [L1, L2, L3]
  - num: 4
    title: Эксплуатация
    required: [L1]
    allowed: [L2]
  - num: 5
    title: Как выглядит в коде
    required: [L1, L2]
  - num: 6
    title: Как чинится
    required: [L1, L2]
  - num: 7
    title: Как проверить фикс
    required: [L1]
  - num: 8
    title: Как ловится автоматикой
    required: [L1]
  - num: 9
    title: Ловушка
    required: [L1, L2]
  - num: 10
    title: Чеклист ревью
    required: [L1, L2]
  - num: 11
    title: Лаба
    required: [L1]
    allowed: [L2]
    alt:
      Задача: [L2]
  - num: 12
    title: Проверь себя
    required: [L1, L2]
  - num: 13
    title: Дальше
    required: [L1, L2, L3]
  - num: 14
    title: Источники
    required: [L1, L2, L3]
