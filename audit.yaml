  - topic: t-0-0-09
    title: "TLS: рукопожатие в общих чертах, цепочка сертификатов, перехват трафика прокси"
    checked: 2026-08-20
    verdict: closed
    blocks:
      mechanics: "ok — rfc9846 §4: рукопожатие, расширения, сообщения Certificate §4.5.1 и CertificateVerify §4.5.2; rfc5280 §6: алгоритм проверки пути сертификации, trust anchor, отзыв"
      in_code: "partial — на уровне кода приложения TLS почти не виден; ревьюер читает расширения самого сертификата (rfc5280 §4.2.1: basicConstraints, nameConstraints) и имена сообщений и расширений рукопожатия из rfc9846, по которым разбирается дамп"
      how_fixed: "ok — rfc5280: что именно обязано проверяться в цепочке; rfc9846 §4.5.1.3: обязательный обрыв при подписи на MD5 и отказ от SHA-1"
      how_verified: "ok — burp-proxy-manage-certificates: откуда берётся CA прокси, экспорт, импорт, перегенерация, создание собственного CA через openssl; burp-proxy-intercept-messages: сам ход перехвата, Forward, Drop, правила и перехват ответа. Ретест: пустить трафик клиента через прокси и посмотреть, примет ли он подставленный сертификат"
    added: [rfc5280-x509]
    detached: []
    notes: >
      Вторая существенная находка. RFC 9846 в §4.5.1.3 пишет дословно:
      «detailed certificate validation procedures are out of scope for TLS
      (see [RFC5280])». Примечание реестра при этом обещало по нему «проверку
      цепочки сертификатов» — то есть треть названия темы писать было не по
      чему. Заодно подтверждено, что сам RFC 9846 существует и вышел в июле
      2026, обсолетив 8446, 5246, 5077, 6961, 7627 и 8422. RFC 5280 не
      обсолетен, но обновлён девятью RFC — список сверять при написании.
    corrections:
      - block: in_code
        was: "partial — на уровне кода приложения TLS почти не виден; burp-docs-proxy показывает картину на проводе и работу с CA-сертификатом"
        why: "прежняя формулировка ссылалась на burp-docs-proxy как на источник «работы с CA-сертификатом»; на той странице этого нет, она обзорная на одну минуту чтения"
        by: appsec-gapfix 2026-08-22
      - block: how_verified
        was: "ok — burp-docs-proxy: установка CA Burp, перехват в обе стороны, HTTP history"
        why: "вердикт ok был поставлен по burp-docs-proxy, где ни установки CA, ни процедуры перехвата нет; блок закрыт после привязки двух подстраниц"
        by: appsec-gapfix 2026-08-22

  - topic: t-0-0-10
    title: "Модель современного приложения: SPA + REST/GraphQL API, серверный рендеринг, reverse proxy, CDN"
    checked: 2026-08-20
    verdict: closed
    blocks:
      mechanics: "ok — webdev-rendering-on-the-web: SSR, статическая генерация, CSR, гидратация, streaming и progressive hydration; mdn-proxy-tunneling: прямой и обратный прокси, CONNECT; rfc9111: общий и приватный кеш, то есть модель CDN, ключ кеша, Vary"
      in_code: "partial — web.dev разбирает подходы без примеров кода, только диаграммы и отсылки к фреймворкам; заголовки Forwarded, X-Forwarded-* и Cache-Control из двух RFC как раз то, что ревьюер видит"
      how_fixed: "ok — rfc7239: доверять только собственной цепочке прокси из allow-list; rfc9111: no-store, private, s-maxage для ответов, которые не должны лежать в общем кеше"
      how_verified: "partial — процедуры ретеста нет ни в одном источнике; проверяется запросом через прокси с подставленным X-Forwarded-For и просмотром заголовков ответа"
    added: [rfc7239-forwarded, rfc9111-http-caching]
    detached: []
    notes: >
      Четыре собственных источника — сознательное превышение потолка «1–3»,
      разрешённое досье при незакрытом блоке. Тема составная: план перечисляет
      в ней SPA, API, серверный рендеринг, reverse proxy и CDN. rfc7239 закрыл
      подделку заголовков прокси (страница MDN о ней молчит вовсе), rfc9111 —
      CDN, который в прежнем наборе не был описан ничем. Предупреждение
      валидатора [ГЛУБИНА] по этой теме — норма, гасить его правкой
      инструмента не нужно.

