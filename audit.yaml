  - topic: t-0-0-04
    title: "Сессии: серверные сессии vs stateless-токены"
    checked: 2026-08-20
    verdict: closed
    blocks:
      mechanics: "ok — owasp-cs-session-management: жизненный цикл идентификатора, энтропия, привязка, хранение на сервере; rfc7519-jwt: три части токена, зарегистрированные claims, JWS и JWE — вторая половина противопоставления"
      in_code: "ok — cheat sheet называет имена по умолчанию (PHPSESSID) и методы фреймворков (HttpSession.invalidate(), session_destroy()); rfc7519 показывает, как выглядит сам токен"
      how_fixed: "ok — cheat sheet: энтропия не ниже 64 бит, ротация идентификатора после смены привилегий, таймауты 2–5 и 15–30 минут, абсолютный 4–8 часов, запрет хранения в localStorage; rfc7519: порядок валидации токена"
      how_verified: "partial — cheat sheet требует серверной проверки и логирования создания, обновления и уничтожения сессии, но готовой процедуры ретеста не даёт; проверка собирается из этих требований"
    added: [rfc7519-jwt]
    detached: []
    notes: >
      Главная находка по этапу. Примечание реестра обещало «серверное
      хранение против самодостаточных токенов», но в Session Management Cheat
      Sheet слов JWT, stateless и self-contained нет вообще — проверено по
      тексту страницы и по списку заголовков разделов. Половина темы,
      вынесенная в её название, была не покрыта ничем. Закрыто привязкой уже
      заведённого rfc7519-jwt (страница открыта заново). Атаки на JWT — тема
      1.7.02, сюда не тянутся.

  - topic: t-0-0-05
    title: "Same-Origin Policy — что именно ограничивает и что нет"
    checked: 2026-08-20
    verdict: closed
    blocks:
      mechanics: "ok — whatwg-html-origin §7.1.1: opaque и tuple origin, same origin и same origin-domain, site и schemelessly same site, сериализация; mdn-same-origin-policy: что закрыто, что открыто, отдельная модель origin у cookies"
      in_code: "ok — mdn-same-origin-policy: document.domain с пометкой deprecated и объяснением, почему механизм подрывает SOP, вместе с двумя ловушками (любое присваивание, включая document.domain = document.domain, обнуляет порт, поэтому значение ставится с обеих сторон; в sandboxed iframe присваивание кидает SecurityError и на localStorage, indexedDB, BroadcastChannel и SharedWorker не действует); межстраничные ссылки iframe.contentWindow, window.parent, window.open, window.opener; postMessage как единственный законный канал; поимённые таблицы свойств Window и Location, доступных cross-origin"
      how_fixed: "ok — mdn: как закрыть чтение (не делать ресурс встраиваемым), запись (CSRF-токен) и встраивание (проверка Content-Type, X-Frame-Options)"
      how_verified: "partial — процедуры проверки ни один источник не даёт; на практике проверяется попыткой cross-origin чтения из консоли браузера"
    added: [whatwg-html-origin]
    detached: []
    notes: >
      Два блока оставлены partial осознанно: SOP — модель, а не дефект, и её
      «фикс» с «проверкой» материализуются в темах 0.06 (CORS), 0.07 (CSP) и
      1.5 (CSRF), где источники с лабами и процедурами уже есть. Третий
      источник ради галочки в блоках 5 и 7 сюда не заводится. Заодно снято
      неверное утверждение реестра, что формальной спецификации у SOP нет:
      понятия origin и same origin определены в HTML Standard нормативно.
    corrections:
      - block: in_code
        was: "partial — mdn даёт таблицу «чтение закрыто, запись и встраивание открыты» и перечень разрешённых свойств window и location, но примеров кода приложения на странице нет"
        why: "ИСПРАВЛЕНИЕ В ПОЛЬЗУ ИСТОЧНИКА, найдено финальной проверкой. Прежняя мотивировка «примеров кода приложения на странице нет» занижена: перечисленное — ровно тот материал, который нужен блоку «как выглядит в коде»"
        by: appsec-gapfix 2026-08-22

