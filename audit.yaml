    verdict: closed
    blocks:
      mechanics: "ok — rfc9110: методы §9, коды §15, поля §5–6, посредники §3.7, Security Considerations §17"
      in_code: "ok — wstg-v42-conf-06: какие методы включены на сервере, заголовки-обходы X-HTTP-Method-Override, X-HTTP-Method, X-Method-Override; rfc9110 даёт инвариант safe/idempotent, по которому ревьюер ловит меняющий состояние GET"
      how_fixed: "ok — wstg-v42-conf-06, раздел Remediation: allow-list методов, снятие обходных заголовков"
      how_verified: "ok — wstg-v42-conf-06: перечисление через OPTIONS и nmap http-methods, ручные PUT и TRACE, запрос HEAD к защищённому ресурсу"
    added: [wstg-v42-conf-06-http-methods]
    detached: []
    notes: >
      RFC 9110 был единственным источником темы и в одиночку закрывал только
      блок «механика»: он описывает семантику, но не то, как она выглядит на
      живом сервере, чем чинится и чем проверяется.

