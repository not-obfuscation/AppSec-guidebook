# Аудит достаточности источников. Миссия appsec-audit.
#
# Вопрос, на который отвечает каждая запись: хватает ли привязанных к теме
# источников, чтобы написать тему по каноническому скелету (часть 4
# PLAYBOOK.md). Планка одна для всех тем и взята из досье миссии: по набору
# должно быть можно написать четыре блока —
#
#   mechanics     блок 3  МЕХАНИКА — модель, граница доверия, источник, sink
#   in_code       блок 5  КАК ВЫГЛЯДИТ В КОДЕ — что ищет глазами ревьюер
#   how_fixed     блок 6  КАК ЧИНИТСЯ — канонический паттерн и его границы
#   how_verified  блок 7  КАК ПРОВЕРИТЬ ФИКС — ретест и регрессия
#
# Значение блока: ok | partial | none, и следом — чем именно закрыт.
# Слово источника само по себе ничего не значит: каждая оценка поставлена
# после личного открытия страницы, не по полю notes реестра.
#
# verdict:
#   closed — тему можно писать целиком
#   gap    — остался блок, который писать не по чему; в поле gap сказано,
#            почему он неустраним
#
# Этап 0 — модели исполнения, а не разборы дефектов (часть 4 PLAYBOOK
# требует их до первого разбора уязвимости). Планка от этого не меняется, но
# читается так: «как чинится» — это канонически правильная конфигурация,
# «как проверить фикс» — как убедиться, что она применена.

# corrections — правки миссии appsec-gapfix (2026-08-22). Появляются у темы,
# у которой финальная проверка (FINAL-CHECK.md) нашла расхождение: вердикт
# блока стоял по странице, где предмета нет, либо обосновывался источником,
# к теме не привязанным. Значение блока в `blocks` заменено на новое, а
# прежнее сохранено в `corrections[].was` вместе с объяснением `why` — молча
# аудит не переписывался. Правок 34, из них по прямым расхождениям: t-2-2-08,
# t-2-5-06, t-5-0-05 (найдены финальной проверкой), t-5-0-08, t-5-0-10
# (найдены при проверке соседей по правилу досье) и t-5-0-07 (исправление в
# пользу источника: маппинг 2021 → 2025 у проекта есть, аудит его не нашёл).

audited:
  stages: [0, 1, 2, 3, 4, 5, 7, 8]

topics:

  # --- Этап 0. База протокола и модели веб-приложения ------------------------

  - topic: t-0-0-01
    title: "HTTP: методы, коды ответов, заголовки запроса и ответа"
