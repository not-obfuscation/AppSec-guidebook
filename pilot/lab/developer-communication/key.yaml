# Ключ проверки заявок. Открывается после своей попытки.
# `вердикт` — что должно стоять в разделе «Вердикт».
# `признак` — что проверялка ищет в ответе стенда после повтора шагов.
key:
  - файл: t1.md
    вердикт: дефект
    признак: "<script>"
    почему: >
      Обработчик ошибок печатает текст исключения без экранирования, и в текст
      исключения попадает имя файла из параметра. Полезная нагрузка
      возвращается внутри <pre> и выполняется в браузере.
  - файл: t2.md
    вердикт: не дефект
    признак: "FIXME"
    почему: >
      Комментарий в разметке — это находка правила «подозрительные
      комментарии», а не дефект: он ничего не раскрывает и ничего не ломает.
      Заявка про него отнимает время разработчика и стоит доверия к
      следующей заявке.
  - файл: t3.md
    вердикт: дефект
    признак: "uid=2"
    почему: >
      Страница заказа не проверяет владельца. Сессия заведена на alice
      (uid=1), а страница отдаёт заказ пользователя uid=2. Ни один инструмент
      этого не находит: ответ правильной формы, неверно то, кому он отдан.
