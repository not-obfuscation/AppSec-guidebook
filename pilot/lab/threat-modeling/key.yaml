# Эталон разметки. Тип элемента по нотации DFD; граница — стоит ли
# элемент на границе доверия; stride — главная категория угрозы.
# Угроза у читателя — своими словами, проверяется только непустота.
key:
  - элемент: поле поиска
    тип: поток
    граница: да
    stride: T
    почему: ввод пользователя пересекает границу и меняет запрос к базе
  - элемент: форма входа
    тип: процесс
    граница: да
    stride: S
    почему: подделать личность дешевле всего через вход
  - элемент: cookie сессии
    тип: поток
    граница: да
    stride: S
    почему: носитель личности едет по сети
  - элемент: таблица товаров
    тип: хранилище
    граница: нет
    stride: I
    почему: чтение невыпущенных товаров — раскрытие информации
  - элемент: админка
    тип: процесс
    граница: да
    stride: E
    почему: цена входа — повышение прав
  - элемент: прокси
    тип: внешний
    граница: да
    stride: I
    почему: посредник видит весь трафик до TLS
