# Разметка отчёта runs/auth-good.txt. Открывается после своей попытки.
# Порядок строк — как в answers.csv.
key:
  - строка: 1
    правило: "40026"
    вердикт: и
    почему: >
      Страница ошибки печатает текст исключения без экранирования, и в текст
      исключения попадает имя файла из параметра. Полезная нагрузка
      возвращается внутри <pre> и выполняется в браузере.
  - строка: 2
    правило: "40026"
    вердикт: и
    почему: >
      То же место кода, другая ручка: int() падает на нечисловом значении, и
      значение попадает в текст ValueError, который печатается как есть.
  - строка: 3
    правило: "40026"
    вердикт: д
    почему: >
      Всё после # на сервер не уходит вовсе. Дефект здесь — сохранённая
      заметка, и он уже показан по верному адресу в строке 5.
  - строка: 4
    правило: "40026"
    вердикт: д
    почему: >
      То же самое: фрагмент до сервера не долетает. Настоящее место — параметр
      q, и оно показано в строке 6 правилом 40012.
  - строка: 5
    правило: "40026"
    вердикт: и
    почему: >
      Заметка сохраняется в состоянии сервера и выводится обратно без
      экранирования — хранимая XSS, видимая только после входа.
  - строка: 6
    правило: "40012"
    вердикт: и
    почему: >
      Значение q уходит в разметку страницы как есть; улика в отчёте — сама
      возвращённая полезная нагрузка.
  - строка: 7
    правило: "6"
    вердикт: и
    почему: >
      os.path.join с абсолютным путём отбрасывает первый довод, и файл
      читается из корня. Улика root:x:0:0 — содержимое /etc/passwd.
  - строка: 8
    правило: "40018"
    вердикт: и
    почему: >
      Параметр cat склеен со строкой запроса; одиночная кавычка ломает
      синтаксис, и стенд отвечает 500. Уверенность Low — сработало по ошибке,
      а не по данным.
  - строка: 9
    правило: "10202"
    вердикт: и
    почему: >
      Форма оформления заказа меняет состояние и не несёт токена: чужая
      страница может её отправить от имени вошедшего.
  - строка: 10
    правило: "10038"
    вердикт: и
    почему: >
      Заголовка Content-Security-Policy нет ни в одном ответе стенда.
  - строка: 11
    правило: "10010"
    вердикт: и
    почему: >
      Cookie сессии ставится без HttpOnly и читается из скрипта — вместе с
      найденными XSS это прямая цепочка.
  - строка: 12
    правило: "10054"
    вердикт: и
    почему: >
      У той же cookie нет SameSite; вместе со строкой 9 это работающая
      межсайтовая отправка формы.
  - строка: 13
    правило: "10036"
    вердикт: и
    почему: >
      Заголовок Server печатает имя и версию сервера и версию Python.
  - строка: 14
    правило: "10096"
    вердикт: л
    почему: >
      1787619506 — номер заказа на главной странице. Правило ловит любое
      десятизначное число, похожее на время эпохи Unix; здесь оно ничего не
      раскрывает.
  - строка: 15
    правило: "10027"
    вердикт: л
    почему: >
      FIXME в комментарии разметки — рабочая пометка про фотографии товара.
      Правило ищет слова-приметы, а не содержание.
  - строка: 16
    правило: "10104"
    вердикт: н
    почему: >
      Правило перебирает заголовок User-Agent и сообщает, что ответы на разные
      значения различаются. Это наблюдение, а не дефект.
  - строка: 17
    правило: "10111"
    вердикт: н
    почему: >
      Сообщение о том, что найдена форма входа. Информационное: оно нужно, чтобы
      настроить аутентифицированный прогон, и чинить в нём нечего.
