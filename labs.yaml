# Реестр лаб. Тип записи `lab` из части 9.2 PLAYBOOK.md.
#
# Заведён потому, что 9.1 п. 2 разрешает ссылки между записями только по `id`, а
# 9.4 объявляет неизвестный `id` в любой ссылке блокирующей ошибкой. Поле
# `labs:` в frontmatter темы ссылается на лабу по идентификатору, и без реестра
# эта ссылка не разрешается ни сборкой, ни проверкой.
#
# Поля:
#   id        kebab-case, неизменяем; в frontmatter темы стоит именно он
#   topic     id темы-дома; у лабы ровно одна тема
#   path      каталог лабы относительно корня; должен существовать
#   kind      найди-дефект | почини | напиши-правило | разверни-и-проверь
#   checked   YYYY-MM-DD — когда лабу последний раз проходили целиком лично
#   notes     что именно в лабе есть
#
# Правила лабы — часть 8.2 плейбука. Реестр правится вручную вместе с лабой.

labs:
  - id: lab-password-storage
    topic: password-storage
    path: pilot/lab/password-storage
    kind: почини
    checked: 2026-08-22
    notes: >
      Уязвимый образец на быстром хеше, цель одной фразой, ровно одна подсказка,
      отдельная задача «почини», решение и тесты на регресс, скрипт атаки для
      демонстрации цены догадки.

  - id: lab-same-origin-policy
    topic: same-origin-policy
    path: pilot/lab/same-origin-policy
    kind: почини
    checked: 2026-08-23
    notes: >
      Три origin на петле в настоящем браузере: шесть опытов, четыре из которых
      останавливает политика, пятый проходит через postMessage, шестой приходит
      от взломанного доверенного виджета. Цель одной фразой, ровно одна
      подсказка, отдельная задача «почини» на список доверенных адресов,
      решение и четыре проверки на регресс. Разрешение имён в браузере
      обрублено на всё, кроме петли, — офлайн проверен флагом, а не обещанием.

  - id: lab-privilege-escalation-vertical
    topic: privilege-escalation-vertical
    path: pilot/lab/privilege-escalation-vertical
    kind: почини
    checked: 2026-08-24
    notes: >
      Мини-маршрутизатор с охраной по списку закрытых путей: три опыта
      эксплойта — незакрытая функция вне списка, тот же путь другим
      регистром, изменяющее действие тем же приёмом — и четвёртый опыт
      контроля, чтобы починка не свелась к запрету всего. Цель одной
      фразой, ровно одна подсказка, решение через отказ по умолчанию и
      один разбор пути, девять функциональных тестов на регресс. Правило
      SAST admin-route-no-authz ловит уязвимый файл и молчит на решении.

  - id: lab-idor
    topic: idor
    path: pilot/lab/idor
    kind: почини
    checked: 2026-08-24
    notes: >
      Кабинет счетов на три записи: чтение чужого счёта по соседнему
      номеру, подмена адреса доставки в чужом счёте той же подстановкой
      и чтение счёта с непредсказуемым UUID, который приезжает из ленты
      компании. Четвёртый опыт — контроль: свой счёт остаётся доступен.
      Решение ищет объект в выборке владельца, отвечает одинаково на
      чужой и несуществующий и убирает чужие ключи из ленты. Семь тестов
      на регресс. Правило SAST object-lookup-unscoped ловит обе уязвимые
      функции и молчит на решении.

  - id: lab-ssrf-basics
    topic: ssrf-basics
    path: pilot/lab/ssrf-basics
    kind: почини
    checked: 2026-08-24
    notes: >
      Витрина партнёрских товаров, тянущая карточку по адресу из
      запроса. Сеть изображена таблицей имён и таблицей служб, сокет не
      открывается ни один. Пять опытов эксплойта: петля, внутренний
      адрес, метаданные облака, схема file: и перенаправление с
      разрешённого хоста внутрь — последнее не закрывается списком
      хостов и вынесено в отдельную задачу «почини». Шестой опыт —
      контроль: карточка партнёра должна отдаваться. Решение проверяет
      схему, имя и адрес после разрешения имени и не проходит
      перенаправления. Восемь тестов на регресс. Правило SAST
      outbound-url-unvalidated ловит уязвимый файл и молчит на решении.

  - id: lab-sqli-basics
    topic: sqli-basics
    path: pilot/lab/sqli-basics
    kind: почини
    checked: 2026-08-24
    notes: >
      Витрина каталога на SQLite в памяти: поиск товаров по категории и
      вход в кабинет, оба запроса собраны склейкой строк. Четыре опыта
      эксплойта — вход по `administrator'--`, скрытые товары по
      `Gifts'--`, весь каталог по `' OR '1'='1`, пароль администратора
      через `UNION SELECT`. Два опыта контроля: обычный поиск и честный
      вход должны остаться. Решение переводит оба запроса на связанные
      параметры. Девять тестов на регресс. Правило SAST
      sql-query-string-built ловит обе уязвимые функции и молчит на
      решении.

  - id: lab-parameterized-queries
    topic: parameterized-queries
    path: pilot/lab/parameterized-queries
    kind: почини
    checked: 2026-08-24
    notes: >
      Витрина «сравнить выбранное» на SQLite в памяти: значение категории
      уже передано связанным параметром, а список id переменной длины собран
      в предложение IN склейкой. Один опыт эксплойта — строка в списке id
      рвёт IN и вытягивает невыпущенные товары; два опыта контроля — выборка
      по id и по категории должны остаться. Решение генерирует заполнитель
      на каждый элемент списка и связывает значения. Пять тестов на регресс.
      Отдельной лабой показана граница применимости параметра, а не запрет
      склейки вообще. Правило SAST sql-query-string-built срабатывает и на
      уязвимом, и на решении: оно видит сборку текста запроса из частей и не
      отличает склейку данных от сборки заполнителей — это разобрано в блоке
      8 темы как слепое пятно статического анализа.

  - id: lab-os-command-injection
    topic: os-command-injection
    path: pilot/lab/os-command-injection
    kind: почини
    checked: 2026-08-24
    notes: >
      Админ-панель строит подпись к отчёту, вызывая внешний инструмент
      (роль инструмента играет echo) через оболочку со склейкой строки.
      Один опыт эксплойта — разделитель `;` и арифметика `$((7*11))`,
      признак исполнения `RESULT=77` нельзя спутать с текстом; два опыта
      контроля — обычная подпись и метасимвол как текст после починки.
      Решение запускает программу без оболочки, аргументы списком. Три
      теста на регресс. Правило SAST os-command-shell-built ловит уязвимый
      файл и молчит на решении. Файлов вне каталога лаба команда не
      создаёт.

  - id: lab-xss-reflected
    topic: xss-reflected
    path: pilot/lab/xss-reflected
    kind: почини
    checked: 2026-08-24
    notes: >
      Витрина поиска в настоящем браузере на петле: присланная строка
      возвращается в ответе дважды — в тексте сообщения и в значении
      атрибута, — а на входе из неё вырезают слово script. Три опыта
      эксплойта (разметка в тексте, выход из значения атрибута, обход
      чистки) и два контроля: обычный поиск и знаки разметки в запросе,
      которые обязаны остаться видимыми. Цель одной фразой, ровно одна
      подсказка, отдельная задача «почини» на второе место вставки,
      решение через экранирование на выводе, восемь функциональных
      тестов на регресс. Правило SAST html-response-string-built ловит
      уязвимый файл и молчит на решении.

  - id: lab-xss-dom
    topic: xss-dom
    path: pilot/lab/xss-dom
    kind: почини
    checked: 2026-08-24
    notes: >
      Кабинет и чужая площадка на петле в настоящем браузере. Сервер
      подставляет ноль значений: три источника приезжают мимо него —
      фрагмент адреса, имя окна, параметр строки запроса, — и попадают в
      три стока. Три опыта эксплойта и два контроля; опыт 1 печатает,
      что сервер увидел за этот запрос, и нагрузки там нет. Цель одной
      фразой, ровно одна подсказка, отдельная задача «почини» на то, что
      починки две, а не одна, решение через textContent и проверку
      адреса, семь функциональных тестов на регресс. Правило SAST
      dom-untrusted-to-sink даёт три находки на уязвимом файле и молчит
      на решении.

  - id: lab-xss-contexts
    topic: xss-contexts
    path: pilot/lab/xss-contexts
    kind: почини
    checked: 2026-08-24
    notes: >
      Карточка товара в настоящем браузере на петле: одно значение
      выводится в пяти местах разметки, экранирование сущностями
      применено ко всем. Три опыта эксплойта — атрибут без кавычек,
      схема javascript в адресе, выход из элемента script — и два
      контроля, один из которых на исходном коде тоже красный: атрибут
      без кавычек теряет хвост законного значения. Цель одной фразой,
      ровно одна подсказка, отдельная задача «почини» на то, что правил
      четыре, а не одно, решение через кавычки, список схем и литерал
      JSON, десять функциональных тестов на регресс. Правило SAST
      html-context-mismatch даёт две находки на уязвимом файле и молчит
      на решении.

  - id: lab-csrf-mechanics
    topic: csrf-mechanics
    path: pilot/lab/csrf-mechanics
    kind: почини
    checked: 2026-08-24
    notes: >
      Кабинет подписки и чужой сайт — два имени, уведённые на петлю, и для
      браузера это два разных сайта. Три опыта эксплойта — POST-форма с
      чужого сайта, то же действие одним GET-переходом, та же форма без
      входа — и два контроля на то, что кабинет после починки живой. Цель
      одной фразой, ровно одна подсказка, отдельная задача «почини» на то,
      что опытов два, а не один, решение через синхронизирующий токен,
      запрет метода GET и явный SameSite, семь функциональных тестов на
      регресс. Вход выполняется заново перед каждым опытом: cookie без
      атрибута SameSite уходит с кросс-сайтовым POST только первые две
      минуты после выставления, и без свежего входа опыт зависел бы от
      часов, а не от защиты.

  - id: lab-jwt-basics
    topic: jwt-basics
    path: pilot/lab/jwt-basics
    kind: почини
    checked: 2026-08-24
    notes: >
      Самодостаточная сессия на JWT: подпись проверяется честно, но в нагрузку
      положены PII и внутренний код. Эксплойт читает их из base64url без ключа,
      контрольный опыт показывает, что подмена роли отвергается проверкой
      подписи. Цель одной фразой, ровно одна подсказка, отдельная задача
      «почини» — убрать конфиденциальные поля из нагрузки, решение и пять
      проверок функциональности на регресс. Правило SAST
      jwt-confidential-claim сверено на code.py и solution.py.

  - id: lab-jwt-attacks
    topic: jwt-attacks
    path: pilot/lab/jwt-attacks
    kind: почини
    checked: 2026-08-24
    notes: >
      Проверяющий берёт алгоритм из заголовка токена. Эксплойт показывает два
      обхода: alg=none снимает подпись, HS256 на открытом ключе сервера даёт
      путаницу ключей — оба выдают роль admin без закрытого ключа. Два
      контрольных опыта: честный RS256 проходит, подмена роли без ключа
      отвергается. Цель одной фразой, ровно одна подсказка, отдельная задача
      «почини» — закрыть список алгоритмов литералом, решение и пять проверок
      функциональности. Правило SAST jwt-alg-from-token сверено на code.py и
      solution.py. Ключи RS256 генерируются в reset(), закрытый в репозиторий
      не попадает.

  - id: lab-oauth-basics
    topic: oauth-basics
    path: pilot/lab/oauth-basics
    kind: почини
    checked: 2026-08-24
    notes: >
      Клиент OAuth берёт токен неявным потоком (response_type=token): сервер
      авторизации моделируется функцией, сети нет. Эксплойт показывает токен
      доступа во фрагменте адреса переадресации и тип запрошенного потока;
      контрольный опыт — вход по-прежнему выдаёт токен. Цель одной фразой,
      ровно одна подсказка, отдельная задача «почини» — перейти на поток кода,
      решение и четыре проверки функциональности. Правило SAST
      oauth-implicit-grant сверено на code.py и solution.py.

  - id: lab-path-traversal
    topic: path-traversal
    path: pilot/lab/path-traversal
    kind: почини
    checked: 2026-08-24
    notes: >
      Служба выдачи документов сверяет собранный путь с базовым каталогом до
      канонизации: строка с переходом вверх проверку проходит, а открывается
      файл снаружи. Дерево каталогов ставится во временном каталоге, сети нет.
      Три опыта эксплойта — переход вверх из корня выдачи, переход вверх из
      законного подкаталога и символическая ссылка изнутри наружу; контрольный
      опыт — законный документ по-прежнему отдаётся. Цель одной фразой, ровно
      одна подсказка, отдельная задача «почини» — канонизировать путь до
      сверки, решение и пять проверок функциональности. Правило SAST
      path-join-user-input сверено на code.py и solution.py.

  - id: lab-business-logic-flaws
    topic: business-logic-flaws
    path: pilot/lab/business-logic-flaws
    kind: почини
    checked: 2026-08-24
    notes: >
      Магазин из четырёх обработчиков, у которого правило предметной области
      держалось на порядке вызовов, а порядок выбирает клиент. Механизмы
      исправны: артикул сверяется с каталогом, суммы складываются точно. Три
      опыта эксплойта — подтверждение без оплаты, цена из тела запроса вместо
      каталожной и скидка, пережившая уменьшение корзины ниже порога;
      контрольный опыт — законный заказ на 450.00 проходит. Цель одной фразой,
      ровно одна подсказка, отдельная задача «почини» — состояние заказа на
      сервере, цена по артикулу и пересчёт скидки, решение и шесть проверок
      функциональности. Правило SAST money-value-from-request сверено на
      code.py и solution.py.

  - id: lab-race-conditions
    topic: race-conditions
    path: pilot/lab/race-conditions
    kind: почини
    checked: 2026-08-24
    notes: >
      Кошелёк и одноразовый промокод, у которых проверка состояния и запись
      решения разнесены по разным запросам. База во временном каталоге, сети
      нет. Два опыта эксплойта по двадцать потоков и тридцать прогонов —
      снятие всего остатка многими запросами сразу и применение одноразового
      кода больше одного раза; контрольный опыт — последовательная работа
      кошелька сохраняется. Числа плавают: перерасход появляется в 15–20
      прогонах из 30. Цель одной фразой, ровно одна подсказка, отдельная
      задача «почини» — условный UPDATE и уникальный ключ в схеме, решение и
      семь проверок функциональности. Правило SAST read-modify-write-no-lock
      сверено на code.py и solution.py.

  - id: lab-crypto-misuse
    topic: crypto-misuse
    path: pilot/lab/crypto-misuse
    kind: почини
    checked: 2026-08-24
    notes: >
      Состояние сессии на клиенте под AES без целостности: профиль в режиме
      ECB, сеанс в режиме счётчика с постоянным одноразовым значением. Ключ
      приложения атакующему неизвестен, всё в памяти, сети нет. Три опыта
      эксплойта детерминированы — повтор блоков ECB виден по карте (пять
      блоков, четыре различных), общий nonce раскрывает чужой сеанс
      (user=victim01;role=admin;credit=9…), правка шифротекста CTR меняет
      role=user0 на admin без ключа и без ошибки; контрольный опыт — свой
      сеанс читается обратно. Цель одной фразой, ровно одна подсказка,
      отдельная задача «почини» — один AES-GCM со свежим nonce и проверка
      метки до разбора, решение и шесть проверок функциональности. Правило
      SAST aes-mode-ecb-or-static-iv (две находки на code.py, ноль на
      solution.py) сверено.

  - id: lab-fail-open
    topic: fail-open-vs-fail-closed
    path: pilot/lab/fail-open
    kind: почини
    checked: 2026-08-24
    notes: >
      Внутренний интерфейс со службой прав и хранилищем счётчиков попыток
      входа: обе зависимости умеют три состояния — жива, мертва и «отвечает,
      но не решением». Три опыта эксплойта детерминированы: при мёртвой службе
      прав обычный пользователь получает 200 на все четыре привилегированных
      действия; при мёртвом хранилище ограничитель пропускает 60 попыток из 60
      при лимите 5; ответ без поля решения разбирается как разрешение.
      Контрольный опыт — при живых зависимостях админу 200, обычному 403,
      ограничитель пропускает ровно пять. Цель одной фразой, ровно одна
      подсказка, отдельная задача «почини» — третьему исходу своя ветка и код
      503, локальный счётчик вместо исчезнувшего ограничителя, шесть проверок
      функциональности. Правило SAST authz-fail-open (две находки на code.py,
      ноль на solution.py) сверено; третий дефект оно не ловит, и это названо
      в README лабы.

  - id: lab-supply-chain-threats
    topic: supply-chain-threats
    path: pilot/lab/supply-chain-threats
    kind: разверни-и-проверь
    checked: 2026-08-25
    notes: >
      Два локальных индекса пакетов (каталоги file://, PEP 503) с одним и тем же
      именем shop-telemetry в версиях 1.0.0 «внутренняя» и 9.9.9 «атакующая», плюс
      пакет-опечатка shop-telementry. Скрипт demo.sh воспроизводит две атаки без
      выхода наружу: dependency confusion (pip с --extra-index-url ставит 9.9.9
      вместо 1.0.0) и typosquatting (pip ставит опечатку без предупреждения о
      похожести имени). Задача «почини» — закрепить источник так, чтобы установка
      снова взяла внутреннюю версию: --index-url без --extra-index-url и пиннинг.
      Проверялка сверяет установленный источник и версию; сети прогон не требует.

  - id: lab-zap-scanning
    topic: zap-scanning
    path: pilot/lab/zap-scanning
    kind: разверни-и-проверь
    checked: 2026-08-25
    notes: >
      Уязвимое приложение «Лавка» на стандартной библиотеке Python, только
      127.0.0.1:8081, тринадцать подставленных дефектов и две приманки для
      ложных срабатываний. Рядом четыре плана автоматизации ZAP (пассивный,
      активный, под входом, по спецификации OpenAPI) и четыре сохранённых
      отчёта ZAP 2.17.0 — лаба проходится целиком без установки сканера.
      Задача чтения: разметить семнадцать строк отчёта четырьмя вердиктами
      (истинная, ложная, дубль по неверному адресу, не дефект), порог 15 из 17.
      Отдельная задача «почини»: закрыть шесть проб hack.py, не уронив семь
      функциональных проверок tests.py; эталон — solution/app.py. Сети прогон
      не требует.

  - id: lab-cve-cvss
    topic: cve-cvss
    path: pilot/lab/cve-cvss
    kind: почини
    checked: 2026-08-25
    notes: >
      Пять настоящих CVE с сохранёнными данными NVD, EPSS и KEV (снимок
      2026-08-24). Задача — посчитать базовый вектор CVSS v3.1 руками для двух из
      них и заполнить таблицу приоритета: severity по CVSS, вероятность по EPSS,
      факт эксплуатации по KEV, итоговый порядок работ. Проверялка сверяет
      посчитанные баллы с эталоном (библиотека cvss 3.6 и калькулятор FIRST) и
      порядок приоритета с ключом: строка с высоким CVSS и низким EPSS обязана
      уступить строке в KEV. Числа детерминированы: снимок офлайн, расчёт ручной.

  - id: lab-sast-principles
    topic: sast-principles
    path: pilot/lab/sast-principles
    kind: найди-дефект
    checked: 2026-08-25
    notes: >
      Два стенда с одинаковыми по смыслу дефектами на разных языках: шесть
      файлов на Python с тремя подставленными дефектами и шесть файлов на Go с
      четырьмя. Рядом с каждым дефектом стоит чистый код похожей формы —
      свёртка ключа кэша на слабом примитиве, имя таблицы из замкнутого
      множества, запуск внешней команды списком доводов. Отчёты bandit 1.9.4 и
      gosec 2.28.0 лежат сохранёнными, свой прогон делается Semgrep по
      локальному файлу правил и сети не требует. Задача — заполнить таблицу на
      пятнадцать строк вердиктом «истинная / ложная / дубль» и признаком;
      проверялка сверяет её с разметкой, порог 14 из 15 и требует признак к
      каждому верному вердикту. Отдельная задача «почини» — снять ложное
      срабатывание на свёртке ключа кэша подавлением по имени теста, не
      выключая правило. Числа детерминированы: сети нет, случайности нет.

  - id: lab-semgrep-rules
    topic: semgrep-rules
    path: pilot/lab/semgrep-rules
    kind: напиши-правило
    checked: 2026-08-25
    notes: >
      Тот же стенд на двух языках, готовая разметка ожиданий и файл правил в
      виде заготовки, на которой прогон разметки не сходится: у правила для Go
      пропуск на запросе, собранном Sprintf в присваивании, у правила для
      Python — ложное срабатывание на вызове с единственным строковым
      литералом. Цель — довести оба правила до «All tests passed», не правя
      разметку. Прогон решения по стенду даёт четыре настоящих дефекта и одно
      ложное срабатывание, которое правилом не снимается. Решение лежит
      отдельным каталогом. Сети прогон не требует.

  - id: lab-developer-communication
    topic: developer-communication
    path: pilot/lab/developer-communication
    kind: разверни-и-проверь
    checked: 2026-08-25
    notes: >
      Стенд на 127.0.0.1:8082 с тремя случаями и настоящим отчётом ZAP 2.17.0,
      снятым на нём же: находка сканера, которая дефект; находка сканера,
      которая не дефект (комментарий FIXME); дефект, о котором в отчёте нет ни
      строки (страница заказа не проверяет владельца). Задача — заполнить три
      заявки по семи разделам. Проверялка берёт раздел «Шаги», повторяет
      запросы одной сессией на стенде и смотрит признак в ответе последнего:
      заявка обязана воспроизводиться по собственному тексту. Ловит три
      промаха порознь — незаполненный раздел, неверный вердикт и шаги без
      полезной нагрузки. Влияние, предложение и срок остаются приёмке
      глазами; эталон — в solution/. Сети прогон не требует.

  - id: lab-pipeline-anatomy
    topic: pipeline-anatomy
    path: pilot/lab/pipeline-anatomy
    kind: почини
    checked: 2026-08-25
    notes: >
      Конвейер из трёх стадий и свой исполнитель на 120 строк: ни сети, ни
      контейнеров, ни форжа. Воспроизводит четыре свойства настоящего
      конвейера — чистый рабочий каталог у каждого job, артефакт как
      единственный объявленный канал между job, кэш без гарантии, вердикт по
      коду возврата. В исходном состоянии конвейер зелёный и печатает «тест:
      артефакта нет — проверять нечего»: стадия test работает вхолостую,
      потому что артефакт никто не запросил, а тест засчитывает его отсутствие
      как успех. Правок нужно две, и порознь они не работают. Проверялка
      делает два прогона: на исправной сборке ждёт зелёного и слова «артефакт
      проверен», на испорченной — красного.

  - id: lab-quality-gates
    topic: quality-gates
    path: pilot/lab/quality-gates
    kind: почини
    checked: 2026-08-25
    notes: >
      Четыре сохранённых отчёта Semgrep 1.174.0 (чисто, один ERROR, новый
      ERROR поверх старого, упавший сканер) и заготовка гейта, отдающая ноль
      всегда. Задача — выполнить договор о трёх кодах возврата: 0 порог не
      превышен, 1 остановить сборку, 2 проверка не отработала. Восемь прогонов
      проверялки разводят порог по уровню, информационный режим, числовой
      бюджет и baseline. Отдельно показано хрупкое место: поля extra.lines и
      extra.fingerprint бесплатная сборка сканера отдаёт строкой «requires
      login», поэтому свой baseline опознаёт находку только по номеру строки.
      Сети прогон не требует.

  - id: lab-pipeline-security
    topic: pipeline-security
    path: pilot/lab/pipeline-security
    kind: почини
    checked: 2026-08-25
    notes: >
      Одно приветствие запроса на слияние, описанное двумя системами, и шесть
      замечаний на двоих: подстановка заголовка в команду шага, повторный
      разбор строки через eval, permissions write-all, pull_request_target с
      checkout чужого кода, сторонний шаг по подвижной ссылке, секрет в
      описании конвейера. Подстановка воспроизводится локально: expand.py
      печатает, что уезжает в оболочку, и на заголовке атакующего показывает
      вывод команды id. Разница систем показана прогоном — у GitHub значение
      подставляется в текст скрипта, у GitLab приезжает в окружение job, и
      правка поэтому разная. Проверялка смотрит три вещи: линтер молчит,
      команда не выполняется ни на одном из трёх заголовков, конвейер не
      выпотрошен. Сети прогон не требует.

  - id: lab-linux-file-permissions
    topic: linux-file-permissions
    path: pilot/lab/linux-file-permissions
    kind: почини
    checked: 2026-09-01
    notes: >
      Сервис пишет конфиг с токеном вызовом os.open с режимом 0666.
      Эксплойт создаёт конфиг под umask 022 и под umask 077 и сверяет
      биты режима через stat: при типичной маске файл читают группа и
      остальные, при строгой — нет, то есть безопасность файла держится
      на окружении, а не на коде. Решение просит 0600 явно. Одиннадцать
      функциональных тестов: запись-чтение, отсутствие затирания в
      ensure_config, отказ пустого токена, работа под тремя umask.
      Сети и прав root не требует.

  - id: lab-linux-setuid
    topic: linux-setuid
    path: pilot/lab/linux-setuid
    kind: почини
    checked: 2026-09-01
    notes: >
      Модель setuid-обёртки backup-run: хост, программы и процессы —
      структуры данных, права проверяются там, где их проверяло бы ядро.
      Эксплойт подменяет сборщик через PATH вызывающего: чужая программа
      исполняется с euid 0 и пишет файл от root; справочный опыт
      показывает, что LD_PRELOAD доезжает до программы. Решение сбрасывает
      окружение до белого списка по образцу sudo env_reset. Восемь
      функциональных тестов. Настоящие привилегии не нужны.

  - id: lab-linux-capabilities
    topic: linux-capabilities
    path: pilot/lab/linux-capabilities
    kind: почини
    checked: 2026-09-01
    notes: >
      Модель агента netprobe, которому для проверки узлов нужна одна
      cap_net_raw, а выдан полный набор root из сорока одной capability.
      Эксплойт от имени процесса агента пробует пять вызовов сверх
      нужного: mount, смену времени, чтение в обход прав, сигнал чужому
      процессу, порт ниже 1024. Решение оставляет ровно cap_net_raw.
      Семь функциональных тестов, включая живой и мёртвый узел. Настоящие
      привилегии не нужны.

  - id: lab-docker-insecure-practices
    topic: docker-insecure-practices
    path: pilot/lab/docker-insecure-practices
    kind: почини
    checked: 2026-09-01
    notes: >
      Модель выхода через примонтированный сокет: демон, API и контейнер
      мониторинга — структуры данных, настоящий Docker не нужен. Контейнеру
      нужно только читать список, а канал у него полный: эксплойт создаёт
      через него контейнер с bind хоста (201). Решение сужает канал до
      одного читающего вызова (403 на остальное). Семь функциональных
      тестов: отчёт по мере роста списка, прямое создание через демон,
      неизвестная точка API. Реальный прогон выхода на живом демоне —
      в тексте темы.

  - id: lab-vault
    topic: vault
    path: pilot/lab/vault
    kind: разверни-и-проверь
    checked: 2026-09-01
    notes: >
      Живой стенд: postgres в контейнере и dev-сервер Vault, оба на
      127.0.0.1, без root. Бланк — два файла: политика приложения
      (database/* на чтение) и создание учётки (GRANT ALL). Проверялка
      применяет оба и гоняет восемь проверок: выдача с TTL, чтение
      разрешено, запись отклонена, второе чтение — другая учётка, отзыв
      аренды убивает учётку в базе, конфигурация движка и sys/ закрыты.
      Эталон в solution/. Стенд гасится командой stop; проверено на
      Vault 1.21.3, postgres:16-alpine.

  - id: lab-threat-modeling
    topic: threat-modeling
    path: pilot/lab/threat-modeling
    kind: найди-дефект
    checked: 2026-09-01
    notes: >
      Задача чтения: по описанию учебной витрины (та же, что в лабе
      sqli-basics) заполняется реестр угроз — тип элемента DFD, граница
      доверия, категория STRIDE, формулировка угрозы. Проверялка сверяет
      бланк с разметкой key.yaml по шести элементам; угроза своя,
      проверяется непустота. Без сети и без стенда.

  - id: lab-owasp-asvs
    topic: owasp-asvs
    path: pilot/lab/owasp-asvs
    kind: найди-дефект
    checked: 2026-09-01
    notes: >
      Задача чтения: прогон шести требований уровня L1 стандарта ASVS
      v5.0.0 по снимку учебной витрины. Вердикты да/нет/н/п сверяются с
      ключом, признак обязан быть непустым. Без сети и без стенда.

  - id: lab-security-logging
    topic: security-logging
    path: pilot/lab/security-logging
    kind: почини
    checked: 2026-09-02
    notes: >
      Журналирование входа в админку учебной витрины: запись содержит
      время, событие, пользователя и исход — и лишние пароль с токеном.
      Три опыта эксплойта: пароль из записи о входе подходит для
      повторного входа, токен из записи о выдаче открывает чужой отчёт,
      перевод строки в имени пользователя печатает поддельную запись.
      Решение маскирует пароль, заменяет токен отпечатком и чистит
      переводы строки. Одиннадцать функциональных тестов: вход, отказ,
      токен, обязательные атрибуты записи. Без сети и без стенда.
