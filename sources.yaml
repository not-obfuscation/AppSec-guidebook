    checked: 2026-08-22
    status: ok
    notes: >
      Действующая практика ключа идемпотентности вместо истёкшего черновика
      IETF (тема 1.9.05): заголовок Idempotency-Key, ключ генерирует клиент
      (рекомендованы UUID v4 или другая строка с достаточной энтропией, до
      255 символов, без персональных данных); сервер сохраняет код ответа и
      тело первого запроса по ключу — включая 5xx — и повторяет их на всех
      последующих; ключи чистятся не раньше чем через 24 часа, после чего тот
      же ключ считается новым запросом; при совпадении ключа и расхождении
      параметров возвращается ошибка; результат не сохраняется, если запрос
      не прошёл валидацию или конфликтует с одновременно выполняющимся;
      ключи принимают только POST, GET и DELETE идемпотентны по определению.
      Ровно то, чего нет в RFC 9110: не свойство метода, а протокол
      безопасного повтора. Вендорская документация первого лица, не пересказ.

