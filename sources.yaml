# Реестр источников гайдбука — источник истины. Человекочитаемые файлы по
# этапам генерируются отсюда (`python tools/gen_sources_md.py`) и вручную не
# правятся: двух источников истины не бывает.
#
# Схема записи (часть 9 PLAYBOOK.md, протокол проверки из SOURCES.md):
#
#   id              kebab-case, уникален, неизменяем после первого использования
#   url             канонический адрес; один источник — один url, дублей нет
#   title           название как на самой странице
#   type            spec | official-docs | tool-docs | standard | owasp |
#                   reference-db | course | book | research | regulation
#   level           1–5 по критерию авторитетности SOURCES.md:
#                   1 первоисточник · 2 отраслевой консенсус · 3 учебный ресурс
#                   с репутацией · 4 книга-эталон · 5 оригинальное исследование
#   publisher       кто издаёт: организация или проект
#   version_or_date версия или дата, как они указаны на странице
#   volatility      stable | medium | fast — когда перепроверять, не оценка качества
#   license         лицензия либо явное «не указана» (это факт, а не пропуск)
#   checked         YYYY-MM-DD — когда страницу лично открывали и сверяли
#   status          ok | needs_manual_check
#   notes           что берём из источника; для needs_manual_check — что не открылось
#   archived_url    опционально; снимки не делаем, поле пустует до написания темы
#
# В реестр попадает только лично открытый источник. Запись со статусом
# needs_manual_check покрытием темы не считается.

sources:

  # --- Этап 0. База протокола и модели веб-приложения ------------------------

  - id: rfc9110-http-semantics
    url: https://www.rfc-editor.org/rfc/rfc9110.html
    title: RFC 9110 — HTTP Semantics
    type: spec
    level: 1
    publisher: IETF (HTTP Working Group)
    version_or_date: STD 97, Standards Track, июнь 2022
    volatility: stable
    license: IETF Trust (BCP 78); код — Revised BSD
    checked: 2026-08-20
    status: ok
    notes: >
      Методы, коды ответа, поля заголовков, семантика запроса и ответа.
      Действующий Internet Standard: обсолетит RFC 2818 и 7230–7235,
      так что ссылки на старую серию устарели. Раздел про посредников
      (proxy, gateway) — опора для темы про reverse proxy и CDN.

  - id: rfc3986-uri
    url: https://www.rfc-editor.org/rfc/rfc3986.html
    title: 'RFC 3986 — Uniform Resource Identifier (URI): Generic Syntax'
    type: spec
    level: 1
    publisher: IETF
    version_or_date: STD 66, Standards Track, январь 2005; обсолетит 2732, 2396,
      1808; обновляет 1738
    volatility: stable
    license: IETF Trust (BCP 78); код — Revised BSD
    checked: 2026-08-22
    status: ok
    notes: >
      Нормативный источник разложения URI на пять компонентов: § 3 «The
      generic URI syntax consists of a hierarchical sequence of components
      referred to as the scheme, authority, path, query, and fragment», с
      ABNF и разметкой примера foo://example.com:8042/over/there?name=
      ferret#nose. Заведён при письме темы 0.02 (миссия appsec-write-0b,
      2026-08-22) по находке Ф-05 приёмки: разложение на пять компонентов
      было приписано исследованию Claroty, которое лишь пересказывает эту
      спецификацию, а заявленный первоисточник темы — WHATWG URL Standard —
      такой модели не даёт вовсе (§ 4.1 определяет запись URL из восьми
      полей, понятия authority среди них нет). Оба разложения верны и
      описывают разные модели; тема обязана назвать это различие.

  - id: whatwg-url
    url: https://url.spec.whatwg.org/
    title: URL Standard
    type: spec
    level: 1
    publisher: WHATWG
    version_or_date: Living Standard, обновлён 18 августа 2026
    volatility: medium
    license: CC BY 4.0
    checked: 2026-08-20
    status: ok
    notes: >
      Боевой алгоритм парсинга и нормализации URL, процентное кодирование,
      IDNA. Именно отсюда растут double encoding и рассогласование парсеров —
      абстрактный RFC 3986 этого не описывает.

  - id: rfc6265bis-cookies
    url: https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/
    title: "Cookies: HTTP State Management Mechanism (rfc6265bis)"
    type: spec
    level: 1
    publisher: IETF (HTTP Working Group)
    version_or_date: draft-ietf-httpbis-rfc6265bis-22, intended status Proposed Standard
    volatility: medium
    license: IETF Trust (BCP 78); код — Revised BSD
    checked: 2026-08-20
    status: ok
    notes: >
      Атрибуты Secure, HttpOnly, SameSite, Domain, Path и алгоритмы хранения
      и отправки cookie. Взят вместо формально живого RFC 6265, который не
      знает про SameSite. Волатильность medium: черновик станет RFC, номер
      версии придётся обновить.

  - id: owasp-cs-session-management
    url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    title: Session Management Cheat Sheet
    type: owasp
    level: 2
    publisher: OWASP Cheat Sheet Series Team
    version_or_date: живой документ, даты публикации на странице нет
    volatility: medium
    license: CC BY-SA 4.0
    checked: 2026-08-20
    status: ok
    notes: >
      Свойства идентификатора сессии (энтропия не ниже 64 бит, длина, имя,
      бессмысленное значение), атрибуты cookie и префикс __Host-, ротация
      идентификатора после смены привилегий, таймауты (2–5 минут для
      высокорисковых приложений, 15–30 для остальных; абсолютный 4–8 часов),
      ручной и автоматический выход, Clear-Site-Data, обнаружение атак.
      Проверено аудитом 2026-08-20: самодостаточных токенов и JWT в
      документе нет вообще — сторону stateless в теме 0.04 закрывает
      rfc7519-jwt. Атаки на сессии разбираются в теме про аутентификацию
      этапа 1.

  - id: mdn-same-origin-policy
    url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy
    title: Same-origin policy
    type: official-docs
    level: 1
    publisher: MDN Web Docs (Mozilla)
    version_or_date: обновлено 29 ноября 2025
    volatility: medium
    license: CC BY-SA 2.5
    checked: 2026-08-20
    status: ok
    notes: >
      Что SOP запрещает и что разрешает: cross-origin чтение закрыто,
      запись и встраивание открыты; перечень встраиваемых ресурсов,
      разрешённые свойства window и location, отдельная модель origin у
      cookies, устаревший document.domain, способы закрыть чтение, запись и
      встраивание. Связного изложения самой политики больше нигде нет, но
      нормативные определения origin лежат в HTML Standard §7.1.1
      (whatwg-html-origin). Проверено аудитом 2026-08-20: примеров кода
      приложения на странице нет, только концептуальные фрагменты.

      АДРЕС ИСПРАВЛЕН 2026-08-22 (миссия appsec-write-0b). Прежний адрес
      /Web/Security/Same-origin_policy отдаёт 301 на
      /Web/Security/Defenses/Same-origin_policy. Содержание то же, правка
      страницы прежняя — 29 ноября 2025.

  - id: whatwg-fetch
    url: https://fetch.spec.whatwg.org/
    title: Fetch Standard
    type: spec
    level: 1
    publisher: WHATWG
    version_or_date: Living Standard, обновлён 20 августа 2026
    volatility: medium
    license: CC BY 4.0
    checked: 2026-08-20
    status: ok
    notes: >
      Протокол CORS: простые запросы и preflight, заголовки Access-Control-*,
      режимы запроса и credentials. Взят вместо W3C CORS, помеченного самим
      W3C как obsolete.

  - id: mdn-cors
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
    title: "Cross-Origin Resource Sharing (CORS)"
    type: official-docs
    level: 1
    publisher: MDN Web Docs (Mozilla)
    version_or_date: обновлено 30 ноября 2025
    volatility: medium
    license: CC BY-SA 2.5
    checked: 2026-08-20
    status: ok
    notes: >
      Тот же протокол, что в Fetch Standard, но со стороны конфигурации:
      разбор типовых ошибок — отражение Origin, wildcard вместе с
      credentials, null origin. Спецификация про это не говорит.

  - id: w3c-csp3
    url: https://www.w3.org/TR/CSP3/
    title: Content Security Policy Level 3
    type: spec
    level: 1
    publisher: W3C (Web Application Security Working Group)
    version_or_date: W3C Working Draft, 13 августа 2026
    volatility: medium
    license: W3C Software and Document License
    checked: 2026-08-20
    status: ok
    notes: >
      Директивы, источники, nonce и hash, strict-dynamic, отчётность.
      Формально черновик, но именно он соответствует тому, что реализуют
      браузеры — в отличие от финализированного, но урезанного CSP2.
      Страница отдаёт 403 curl'у (Cloudflare) и открывается штатным
      фетчером; содержание и статус сверены лично.

  - id: mdn-csp
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
    title: Content Security Policy (CSP)
    type: official-docs
    level: 1
    publisher: MDN Web Docs (Mozilla)
    version_or_date: обновлено 22 марта 2026
    volatility: medium
    license: CC BY-SA 2.5
    checked: 2026-08-20
    status: ok
    notes: >
      Практическая сторона CSP: как политика выглядит в заголовке и в
      мета-теге, готовые примеры, отчёты о нарушениях, поддержка в
      браузерах. Закрывает блоки «как выглядит в коде» и «как проверить»,
      которых нет в спецификации.

  - id: owasp-cs-http-headers
    url: https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html
    title: HTTP Security Response Headers Cheat Sheet
    type: owasp
    level: 2
    publisher: OWASP Cheat Sheet Series Team
    version_or_date: живой документ, даты публикации на странице нет
    volatility: medium
    license: CC BY-SA 4.0
    checked: 2026-08-20
    status: ok
    notes: >
      X-Frame-Options, X-Content-Type-Options, Referrer-Policy,
      Permissions-Policy, COOP, COEP, CORP, Cache-Control, Set-Cookie:
      назначение и рекомендуемое значение, плюс явно помеченные мёртвыми
      Expect-CT и HPKP. Есть готовые конфиги для PHP, Apache, IIS, HAProxy,
      Nginx и Express и раздел «Testing Proper Implementation of Security
      Headers» — им и закрывается блок «как проверить фикс». Проверено
      аудитом 2026-08-20: Clear-Site-Data в этом cheat sheet'е нет, он
      разобран в Session Management Cheat Sheet.

  - id: rfc6797-hsts
    url: https://www.rfc-editor.org/rfc/rfc6797.html
    title: RFC 6797 — HTTP Strict Transport Security (HSTS)
    type: spec
    level: 1
    publisher: IETF (WebSec Working Group)
    version_or_date: Standards Track, ноябрь 2012
    volatility: stable
    license: IETF Trust (BCP 78); код — Revised BSD
    checked: 2026-08-20
    status: ok
    notes: >
      Механизм HSTS: синтаксис заголовка, max-age, includeSubDomains,
      обработка ошибок сертификата, окно первого визита, которое HSTS не
      закрывает. Первоисточник — cheat sheet даёт только рекомендацию.

  - id: rfc9846-tls13
    url: https://www.rfc-editor.org/rfc/rfc9846.html
    title: RFC 9846 — The Transport Layer Security (TLS) Protocol Version 1.3
    type: spec
    level: 1
    publisher: IETF (TLS Working Group)
    version_or_date: Proposed Standard, июль 2026
    volatility: stable
    license: IETF Trust (BCP 78); код — Revised BSD
    checked: 2026-08-20
    status: ok
    notes: >
      Рукопожатие TLS 1.3, обмен ключами и расширения, сообщения
      Certificate и CertificateVerify, запрет MD5 и отказ от SHA-1 при
      проверке подписи сертификата. Обсолетит RFC 8446 (и RFC 5246 для
      TLS 1.2, а также 5077, 6961, 7627, 8422) — ссылка на 8446 на момент
      написания гайда уже устарела бы. Проверено аудитом 2026-08-20:
      §4.5.1.3 прямо выводит подробную проверку сертификата за рамки TLS и
      отсылает к RFC 5280 — цепочку сертификатов писать по rfc5280-x509.

  - id: burp-docs-proxy
    url: https://portswigger.net/burp/documentation/desktop/tools/proxy
    title: Burp Proxy — documentation
    type: tool-docs
    level: 1
    publisher: PortSwigger
    version_or_date: обновлено 19 августа 2026
    volatility: fast
    license: не указана; © PortSwigger
    checked: 2026-08-20
    status: ok
    notes: >
      Перехват и модификация запросов, история, правила перехвата, установка
      CA-сертификата Burp в браузер — то есть практическая сторона того, как
      прокси вклинивается в TLS-соединение. Документация живого продукта:
      перепроверять при каждом использовании.

      ИСПРАВЛЕНО 2026-08-22 (миссия appsec-gapfix). Прежний текст этой записи
      обещал «установку CA-сертификата Burp в браузер» — на странице этого
      нет, страница обзорная, на одну минуту чтения. Управление CA вынесено
      на подстраницу Managing CA certificates, сама процедура перехвата — на
      Intercepting messages; обе заведены отдельными записями
      (burp-proxy-manage-certificates, burp-proxy-intercept-messages). Эта
      запись остаётся указателем на раздел.

  - id: webdev-rendering-on-the-web
    url: https://web.dev/articles/rendering-on-the-web
    title: Rendering on the Web
    type: official-docs
    level: 1
    publisher: web.dev (Google); Jason Miller, Addy Osmani
    version_or_date: опубликовано 6 февраля 2019, обновлено 5 января 2026
    volatility: medium
    license: CC BY 4.0 (текст), Apache 2.0 (код)
    checked: 2026-08-20
    status: ok
    notes: >
      Разбор SSR, статической генерации, гидратации и клиентского рендеринга
      с явным сравнением: где выполняется код и что уезжает на клиент. Даёт
      ту часть «модели современного приложения», которой нет в спецификациях.

  - id: mdn-proxy-tunneling
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Proxy_servers_and_tunneling
    title: Proxy servers and tunneling
    type: official-docs
    level: 1
    publisher: MDN Web Docs (Mozilla)
    version_or_date: обновлено 9 ноября 2025
    volatility: medium
    license: CC BY-SA 2.5
    checked: 2026-08-20
    status: ok
    notes: >
      Прямой и обратный прокси и их задачи (балансировка, кеширование,
      сжатие), туннелирование через CONNECT и ограничение портом 443,
      заголовки Forwarded, X-Forwarded-For, X-Forwarded-Host,
      X-Forwarded-Proto и Via. Вторая половина «модели современного
      приложения»: кто стоит перед приложением. Проверено аудитом
      2026-08-20: о подделке этих заголовков страница не говорит ничего —
      недоверие к ним берётся из rfc7239-forwarded. То же касается темы
      1.1.07, где эта запись стоит вторым источником.

  - id: openapi-spec
    url: https://spec.openapis.org/oas/latest.html
    title: OpenAPI Specification
    type: spec
    level: 1
    publisher: OpenAPI Initiative (Linux Foundation)
    version_or_date: v3.2.0, 19 сентября 2025
    volatility: stable
    license: Apache License 2.0
    checked: 2026-08-20
    status: ok
    notes: >
      Как описывается устройство REST API: пути, операции, параметры, тела
      запросов, схемы безопасности. Мест параметра в версии 3.2.0 **пять**, а
      не четыре: § 4.12.1 перечисляет path, query, querystring, header,
      cookie; querystring добавлен в 3.2.0 и не может встречаться в одной
      операции вместе с query (уточнено при письме темы 0.11, 2026-08-22). Для AppSec
      это перечень точек входа в машиночитаемом виде. URL `latest`
      преднамеренно нефиксированный — версию сверять при использовании.

  - id: openapi-311
    url: https://spec.openapis.org/oas/v3.1.1.html
    title: OpenAPI Specification v3.1.1
    type: spec
    level: 1
    publisher: OpenAPI Initiative (Linux Foundation)
    version_or_date: v3.1.1, 24 октября 2024
    volatility: stable
    license: Apache License 2.0
    checked: 2026-08-23
    status: ok
    notes: >
      Вторая сторона сравнения версий в теме 0.11: 3.1.1 говорит «There are
      four possible parameter locations specified by the in field» и
      перечисляет path, query, header, cookie — слово querystring в тексте
      издания не встречается ни разу (проверено grep по снятой разметке,
      2026-08-23). Нужна именно эта запись, а не `openapi-spec`: та ведёт на
      `latest.html` и показывает уже 3.2.0, где мест пять. Адрес с номером
      версии фиксированный и от выпуска новых версий не меняется.

  - id: graphql-spec
    url: https://spec.graphql.org/September2025/
    title: GraphQL — September 2025 Edition
    type: spec
    level: 1
    publisher: GraphQL Specification Project (Joint Development Foundation),
      GraphQL Foundation
    version_or_date: September 2025 Edition (выпуск от 3 сентября 2025)
    volatility: medium
    license: Open Web Foundation Agreement 1.0 (Patent and Copyright Grants);
      исходный код — MIT, наборы данных — CC0 1.0
    checked: 2026-08-23
    status: ok
    notes: >
      Нормативный документ GraphQL: то, чего у темы 0.11 не было, когда она
      писала «спецификация обязывает». Что берём: § 4.1 — интроспекция имени
      типа доступна в любом наборе выборки, с единственным исключением выборок
      в корне операции подписки, через мета-поле `__typename: String!` на
      любом объектном, интерфейсном или объединяющем типе; § 4.2 — мета-поля
      `__schema` и `__type` доступны от типа корня операции чтения; врезка
      Reserved Names в разделе 4 — имена в системе типов не начинаются с двух
      подчёркиваний, они зарезервированы за интроспекцией (нумерованного
      подраздела у этой врезки нет, потому и названа врезкой). Издание сентября 2025 — текущее по
      списку на spec.graphql.org (проверено 2026-08-23); формулировки § 4.1 и
      § 4.2 дословно совпадают с изданием October 2021, на которое ссылались
      раньше. Канонический адрес отдаёт штатному фетчеру 403, открывается
      curl'ом с браузерным User-Agent.

  - id: graphql-learn
    url: https://graphql.org/learn/
    title: Learn GraphQL
    type: official-docs
    level: 1
    publisher: The GraphQL Foundation
    version_or_date: живой сайт, © 2026 The GraphQL Foundation; даты страницы нет
    volatility: medium
    license: не указана на странице
    checked: 2026-08-20
    status: ok
    notes: >
      Схема и система типов, запросы, мутации, подписки, валидация,
      исполнение резолверов, интроспекция. Точки входа в GraphQL — это поля
      схемы, а не URL; отсюда видно, почему единственный эндпоинт не значит
      одну точку входа. Штатному фетчеру отдаёт 403, открыт curl'ом с
      браузерным User-Agent.

      УКАЗАТЕЛЬ, НЕ ПОКРЫТИЕ (письмо темы 0.11, 2026-08-22). Страница
      /learn/ — оглавление курса: перечень из шестнадцати уроков с
      однострочными аннотациями и ни одного содержательного абзаца.
      Всё перечисленное выше лежит на подстраницах. Тот же класс, что
      находка С-1 FINAL-CHECK.md. От темы 0.11 отвязана, содержание
      закрывают graphql-learn-serving-over-http и graphql-learn-security.
      Запись оставлена: она годится как точка входа в курс.


  # Добавлено при письме темы 0.11 (миссия appsec-write-0b, 2026-08-22):
  # graphql-learn оказался оглавлением курса, содержание — на подстраницах.

  - id: graphql-learn-serving-over-http
    url: https://graphql.org/learn/serving-over-http/
    title: Serving over HTTP
    type: official-docs
    level: 1
    publisher: The GraphQL Foundation
    version_or_date: живой сайт, © 2026 The GraphQL Foundation; даты страницы нет
    volatility: medium
    license: не указана на странице
    checked: 2026-08-22
    status: ok
    notes: >
      Как GraphQL ложится на HTTP: единственный эндпоинт (обычно /graphql)
      вместо адресуемых ресурсов; место GraphQL в конвейере промежуточного
      слоя — после аутентификации, а решения об авторизации на уровне полей
      принимаются бизнес-логикой из резолверов во время ExecuteRequest();
      обязательная поддержка POST и необязательная GET, причём GET только для
      операций чтения; формат тела (query, operationName, variables,
      extensions) и формат ответа (data, errors, extensions); медиатип
      application/graphql-response+json; persisted и trusted documents как
      способ не гнать текст операции в строке запроса. Именно эта страница, а
      не оглавление курса, закрывает блок «механика» темы 0.11 со стороны
      GraphQL. Штатному фетчеру отдаёт 403, открывается curl'ом с браузерным
      User-Agent.

