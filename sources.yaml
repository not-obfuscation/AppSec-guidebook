      OpenSSL, что в Python. Про соль: «recommended that a salt is random
      and at least 16 bytes long», со ссылкой на NIST SP 800-132.
      crypto.timingSafeEqual — сравнение за постоянное время, требует
      одинаковой длины буферов и прямо назван пригодным для сравнения
      «HMAC digests or secret values»; тут же оговорка, что сам по себе
      он не делает окружающий код устойчивым к таймингу.
      Argon2 в стандартной библиотеке нет.

