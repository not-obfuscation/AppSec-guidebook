      запроса с весами типов и полей); валидация и очистка значений
      аргументов сверх встроенных скалярных типов; интроспекция как «security
      through obscurity» с прямой оговоркой, что сама по себе она недостаточна;
      маскирование подсказок в сообщениях об ошибках, потому что по ним форма
      схемы выводится и при выключенной интроспекции. Закрывает блоки «как
      чинится» и «чеклист ревью» темы 0.11 со стороны GraphQL. Штатному
      фетчеру отдаёт 403, открывается curl'ом с браузерным User-Agent.

